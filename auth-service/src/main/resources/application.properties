spring.application.name=auth-service
spring.datasource.url=jdbc:mysql://localhost:3309/auth_service
spring.datasource.username=appuser
spring.datasource.password=apppassword
spring.jpa.hibernate.ddl-auto=update
server.port=8083
management.endpoints.web.exposure.include=health,info,prometheus
management.prometheus.metrics.export.enabled=true
eureka.client.serviceUrl.defaultZone=http://localhost:8761/eureka

jwt.secret=MY_SUPER_SECRET_KEY_123456789012345678901234567890
jwt.access-expiration=86400000
jwt.refresh-expiration=604800000

# Kafka Configuration
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer

spring.kafka.producer.acks=all
spring.kafka.producer.retries=10
spring.kafka.producer.properties.enable.idempotence=true
spring.kafka.producer.properties.max.in.flight.requests.per.connection=5


spring.devtools.restart.enabled=false

resilience4j.circuitbreaker.instances.user-service.sliding-window-size=5
resilience4j.circuitbreaker.instances.user-service.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.user-service.wait-duration-in-open-state=10s
resilience4j.circuitbreaker.instances.user-service.permitted-number-of-calls-in-half-open-state=3

