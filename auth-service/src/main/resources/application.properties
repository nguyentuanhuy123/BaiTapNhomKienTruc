spring.application.name=auth-service
server.port=8083

# Graceful Shutdown
# Complete processing active requests before shutting down
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=30s

# Tomcat Thread Pool
# min-spare: minimum threads kept alive to save CPU/RAM
# max: maximum scale up for high concurrent requests
# accept-count: queue size when all threads are busy
server.tomcat.threads.min-spare=10
server.tomcat.threads.max=200
server.tomcat.accept-count=100
server.tomcat.connection-timeout=10000

# Datasource (MySQL)
spring.datasource.url=jdbc:mysql://localhost:3309/auth_service
spring.datasource.username=appuser
spring.datasource.password=apppassword
spring.jpa.hibernate.ddl-auto=update

# HikariCP Connection Pool
spring.datasource.hikari.pool-name=AuthHikariPool
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.keepalive-time=60000

# Redis
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.lettuce.pool.min-idle=2
spring.data.redis.lettuce.pool.max-idle=10
spring.data.redis.lettuce.pool.max-active=20
spring.data.redis.lettuce.pool.max-wait=1000ms

# Actuator / Metrics
management.endpoints.web.exposure.include=health,info,prometheus
management.prometheus.metrics.export.enabled=true
management.endpoint.health.show-details=always
management.health.redis.enabled=true
management.health.db.enabled=true

# Eureka
eureka.client.serviceUrl.defaultZone=http://localhost:8761/eureka

# JWT
jwt.secret=MY_SUPER_SECRET_KEY_123456789012345678901234567890
jwt.access-expiration=86400000
jwt.refresh-expiration=604800000

# Kafka Producer
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.producer.acks=all
spring.kafka.producer.retries=10
spring.kafka.producer.properties.enable.idempotence=true
spring.kafka.producer.properties.max.in.flight.requests.per.connection=5
spring.kafka.producer.compression-type=lz4
spring.kafka.producer.batch-size=16384
spring.kafka.producer.linger-ms=5

# Resilience4j Circuit Breaker
resilience4j.circuitbreaker.instances.user-service.sliding-window-size=5
resilience4j.circuitbreaker.instances.user-service.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.user-service.wait-duration-in-open-state=10s
resilience4j.circuitbreaker.instances.user-service.permitted-number-of-calls-in-half-open-state=3

spring.devtools.restart.enabled=false
