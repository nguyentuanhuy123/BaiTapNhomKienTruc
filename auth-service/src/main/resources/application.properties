spring.application.name=auth-service
server.port=8083

# ??? Graceful Shutdown ????????????????????????????????????????????????????????
# Hoàn thành request ?ang x? lý tr??c khi t?t pod (rolling deploy / scale-down an toàn)
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=30s

# ??? Tomcat Thread Pool ???????????????????????????????????????????????????????
# min-spare: s? thread luôn s?n sàng ? ti?t ki?m CPU/RAM khi ít request
# max: scale lên t?i ?a khi có hàng nghìn request ??ng th?i
# accept-count: queue ch? khi h?t thread (tránh t? ch?i k?t n?i ??t ng?t)
server.tomcat.threads.min-spare=10
server.tomcat.threads.max=200
server.tomcat.accept-count=100
server.tomcat.connection-timeout=10000

# ??? Datasource (MySQL) ???????????????????????????????????????????????????????
spring.datasource.url=jdbc:mysql://localhost:3309/auth_service
spring.datasource.username=appuser
spring.datasource.password=apppassword
spring.jpa.hibernate.ddl-auto=update

# ??? HikariCP Connection Pool ????????????????????????????????????????????????
# Khi ít request: ch? gi? 5 connection idle ? ti?t ki?m tài nguyên DB
# Khi nhi?u request: t? scale lên t?i ?a 20 connection
spring.datasource.hikari.pool-name=AuthHikariPool
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.maximum-pool-size=20
# ?óng connection idle quá 5 phút (gi?i phóng khi scale-down)
spring.datasource.hikari.idle-timeout=300000
# Tái t?o connection sau 30 phút ?? tránh connection stale
spring.datasource.hikari.max-lifetime=1800000
# Ch? t?i ?a 20s ?? l?y connection t? pool (tránh timeout cascade)
spring.datasource.hikari.connection-timeout=20000
# Ping gi? connection s?ng (tránh firewall/DB c?t k?t n?i im l?ng)
spring.datasource.hikari.keepalive-time=60000

# ??? Redis ????????????????????????????????????????????????????????????????????
spring.data.redis.host=localhost
spring.data.redis.port=6379
# Lettuce connection pool ? scale theo load, gi?i phóng khi nhàn r?i
spring.data.redis.lettuce.pool.min-idle=2
spring.data.redis.lettuce.pool.max-idle=10
spring.data.redis.lettuce.pool.max-active=20
spring.data.redis.lettuce.pool.max-wait=1000ms

# ??? Actuator / Metrics ???????????????????????????????????????????????????????
management.endpoints.web.exposure.include=health,info,prometheus
management.prometheus.metrics.export.enabled=true
# Hi?n th? chi ti?t health (DB, Redis, Kafka) ?? Kubernetes / load balancer ki?m tra
management.endpoint.health.show-details=always
management.health.redis.enabled=true
management.health.db.enabled=true

# ??? Eureka ??????????????????????????????????????????????????????????????????
eureka.client.serviceUrl.defaultZone=http://localhost:8761/eureka

# ??? JWT ?????????????????????????????????????????????????????????????????????
jwt.secret=MY_SUPER_SECRET_KEY_123456789012345678901234567890
jwt.access-expiration=86400000
jwt.refresh-expiration=604800000

# ??? Kafka Producer ??????????????????????????????????????????????????????????
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.producer.acks=all
spring.kafka.producer.retries=10
spring.kafka.producer.properties.enable.idempotence=true
spring.kafka.producer.properties.max.in.flight.requests.per.connection=5
# Compression gi?m bandwidth Kafka khi có nhi?u event (scale-up)
spring.kafka.producer.compression-type=lz4
# Batch gom events ?? gi?m s? l?n g?i Kafka (throughput cao h?n)
spring.kafka.producer.batch-size=16384
spring.kafka.producer.linger-ms=5

# ??? Resilience4j Circuit Breaker ????????????????????????????????????????????
resilience4j.circuitbreaker.instances.user-service.sliding-window-size=5
resilience4j.circuitbreaker.instances.user-service.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.user-service.wait-duration-in-open-state=10s
resilience4j.circuitbreaker.instances.user-service.permitted-number-of-calls-in-half-open-state=3

spring.devtools.restart.enabled=false
