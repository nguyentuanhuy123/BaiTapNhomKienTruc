#Kafka Consumer properties
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.consumer.group-id=notification-service-group
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer

spring.kafka.consumer.properties.spring.json.trusted.packages=com.fit.microservices.*
#spring.kafka.consumer.properties.spring.json.value.default.type=com.fit.microservices.notification.event.OrderPlacedEvent
spring.kafka.consumer.properties.spring.json.type.mapping=\
  com.fit.microservices.auth.dto.ForgotPasswordEvent:com.fit.microservices.notification.event.ForgotPasswordEvent


spring.kafka.consumer.auto-offset-reset=latest

management.endpoints.web.exposure.include=health,info,prometheus
management.prometheus.metrics.export.enabled=true

# Kafka Producer
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.producer.properties.spring.json.add.type.headers=false

# Retry & DLQ settings
notification.kafka.retry.attempts=3
notification.kafka.retry.interval-ms=2000

server.port=8085
