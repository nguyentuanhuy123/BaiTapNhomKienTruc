spring.application.name=api-gateway
server.port=9000

# ??? Graceful Shutdown ????????????????????????????????????????????????????????
# Ho�n th�nh c�c request ?ang x? l� tr??c khi t?t (quan tr?ng cho rolling deploy)
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=30s

# ??? Eureka ??????????????????????????????????????????????????????????????????
eureka.client.serviceUrl.defaultZone=http://localhost:8761/eureka

# ??? Logging ?????????????????????????????????????????????????????????????????
logging.level.root=INFO
logging.level.org.springframework.cloud.gateway.route.RouteDefinitionLocator=INFO
logging.level.org.springframework.cloud.gateway=WARN

# ??? Reactor Netty Performance ???????????????????????????????????????????????
# 0 = auto (2 � s? CPU core) ? ?? cho I/O b?t ??ng b? WebFlux
spring.reactor.netty.io-worker-count=0
# Pending request queue khi t?t c? worker b?n (gi?m DROP thay v� t?ng thread)
spring.reactor.netty.io-select-count=0

# ??? HTTP Client (upstream calls) ?????????????????????????????????????????????
# Pool k?t n?i t?i c�c upstream service (per-host)
spring.cloud.gateway.server.webflux.httpclient.pool.max-connections=500
spring.cloud.gateway.server.webflux.httpclient.pool.max-idle-time=30s
spring.cloud.gateway.server.webflux.httpclient.pool.acquire-timeout=5000
# Timeout ch? upstream response
spring.cloud.gateway.server.webflux.httpclient.response-timeout=30s
spring.cloud.gateway.server.webflux.httpclient.connect-timeout=5000

# ??? Routes ??????????????????????????????????????????????????????????????????

# Product Service
spring.cloud.gateway.server.webflux.routes[0].id=product-service
spring.cloud.gateway.server.webflux.routes[0].uri=lb://product-service
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/api/product/**

spring.cloud.gateway.server.webflux.routes[4].id=product-service-category
spring.cloud.gateway.server.webflux.routes[4].uri=lb://product-service
spring.cloud.gateway.server.webflux.routes[4].predicates[0]=Path=/api/category/**

# Order Service
spring.cloud.gateway.server.webflux.routes[1].id=order-service
spring.cloud.gateway.server.webflux.routes[1].uri=lb://order-service
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/api/order/**, /api/cart/**

# Inventory Service
spring.cloud.gateway.server.webflux.routes[2].id=inventory-service
spring.cloud.gateway.server.webflux.routes[2].uri=lb://inventory-service
spring.cloud.gateway.server.webflux.routes[2].predicates[0]=Path=/api/inventory/**

# User Service
spring.cloud.gateway.server.webflux.routes[3].id=user-service
spring.cloud.gateway.server.webflux.routes[3].uri=lb://user-service
spring.cloud.gateway.server.webflux.routes[3].predicates[0]=Path=/api/user/**

# Discovery Server
spring.cloud.gateway.server.webflux.routes[5].id=discovery-server
spring.cloud.gateway.server.webflux.routes[5].uri=http://localhost:8761
spring.cloud.gateway.server.webflux.routes[5].predicates[0]=Path=/eureka/web
spring.cloud.gateway.server.webflux.routes[5].filters[0]=SetPath=/

# Discovery Server Static Resources
spring.cloud.gateway.server.webflux.routes[6].id=discovery-server-static
spring.cloud.gateway.server.webflux.routes[6].uri=http://localhost:8761
spring.cloud.gateway.server.webflux.routes[6].predicates[0]=Path=/eureka/**

# Auth Service ? STRICT rate limit per IP (ch?ng brute-force login/register)
# Gi?i h?n: 5 request/gi�y, burst t?i ?a 10
spring.cloud.gateway.server.webflux.routes[7].id=auth-service
spring.cloud.gateway.server.webflux.routes[7].uri=lb://auth-service
spring.cloud.gateway.server.webflux.routes[7].predicates[0]=Path=/api/auth/**
spring.cloud.gateway.server.webflux.routes[7].filters[0].name=RequestRateLimiter
spring.cloud.gateway.server.webflux.routes[7].filters[0].args.key-resolver=#{@ipKeyResolver}
spring.cloud.gateway.server.webflux.routes[7].filters[0].args.redis-rate-limiter.replenishRate=5
spring.cloud.gateway.server.webflux.routes[7].filters[0].args.redis-rate-limiter.burstCapacity=10
spring.cloud.gateway.server.webflux.routes[7].filters[0].args.redis-rate-limiter.requestedTokens=1

# Payment Service
spring.cloud.gateway.server.webflux.routes[8].id=payment-service
spring.cloud.gateway.server.webflux.routes[8].uri=lb://payment-service
spring.cloud.gateway.server.webflux.routes[8].predicates[0]=Path=/payment/**,/api/payment/**

# WebSocket route ? b? qua rate limiter (handshake ch? x?y ra 1 l?n)
spring.cloud.gateway.server.webflux.routes[9].id=user-ws-route
spring.cloud.gateway.server.webflux.routes[9].uri=lb:ws://user-service
spring.cloud.gateway.server.webflux.routes[9].predicates[0]=Path=/ws/**

# Flashsale Service
spring.cloud.gateway.server.webflux.routes[10].id=flashsale-service
spring.cloud.gateway.server.webflux.routes[10].uri=lb://flashsale-service
spring.cloud.gateway.server.webflux.routes[10].predicates[0]=Path=/api/v1/flashsale/**

# Wishlist
spring.cloud.gateway.server.webflux.routes[11].id=wishlist-service
spring.cloud.gateway.server.webflux.routes[11].uri=lb://product-service
spring.cloud.gateway.server.webflux.routes[11].predicates[0]=Path=/api/wishlist/**

# Chatbot
spring.cloud.gateway.server.webflux.routes[12].id=chatbot-service
spring.cloud.gateway.server.webflux.routes[12].uri=lb://chatbot-service
spring.cloud.gateway.server.webflux.routes[12].predicates[0]=Path=/api/chatbot/**

# Comment Route
spring.cloud.gateway.server.webflux.routes[13].id=comment-service
spring.cloud.gateway.server.webflux.routes[13].uri=lb://product-service
spring.cloud.gateway.server.webflux.routes[13].predicates[0]=Path=/api/comment/**

# Frontend Route (Thêm vào cuối danh sách routes)
spring.cloud.gateway.server.webflux.routes[14].id=frontend-service
spring.cloud.gateway.server.webflux.routes[14].uri=http://localhost:5173
spring.cloud.gateway.server.webflux.routes[14].predicates[0]=Path=/**

# ??? Actuator / Metrics ???????????????????????????????????????????????????????
management.endpoints.web.exposure.include=health,info,prometheus
management.prometheus.metrics.export.enabled=true
management.endpoint.health.show-details=when-authorized

# ??? CORS (dev) ???????????????????????????????????????????????????????????????
spring.cloud.gateway.server.webflux.globalcors.add-to-simple-url-handler-mapping=true
spring.cloud.gateway.server.webflux.globalcors.cors-configurations.[/**].allowed-origins=http://localhost:5173
spring.cloud.gateway.server.webflux.globalcors.cors-configurations.[/**].allowed-methods=GET,POST,PUT,PATCH,DELETE,OPTIONS
spring.cloud.gateway.server.webflux.globalcors.cors-configurations.[/**].allowed-headers=*
spring.cloud.gateway.server.webflux.globalcors.cors-configurations.[/**].allow-credentials=true

# ??? Default Filters ??????????????????????????????????????????????????????????
# Lo?i b? header CORS tr�ng l?p t? upstream service (WebSocketConfig, etc.)
spring.cloud.gateway.server.webflux.default-filters[0]=DedupeResponseHeader=Access-Control-Allow-Origin RETAIN_FIRST
spring.cloud.gateway.server.webflux.default-filters[1]=DedupeResponseHeader=Access-Control-Allow-Methods RETAIN_FIRST
spring.cloud.gateway.server.webflux.default-filters[2]=DedupeResponseHeader=Access-Control-Allow-Headers RETAIN_FIRST
spring.cloud.gateway.server.webflux.default-filters[3]=DedupeResponseHeader=Access-Control-Allow-Credentials RETAIN_FIRST

# ??? Global Rate Limiter (�p d?ng cho t?t c? route tr? auth ?� c� filter ri�ng) ?
# Key: userId (JWT) ho?c IP (n?u ch?a ??ng nh?p)
# 20 request/gi�y per user/IP, burst t?i ?a 50
spring.cloud.gateway.server.webflux.default-filters[4].name=RequestRateLimiter
spring.cloud.gateway.server.webflux.default-filters[4].args.key-resolver=#{@userKeyResolver}
spring.cloud.gateway.server.webflux.default-filters[4].args.redis-rate-limiter.replenishRate=20
spring.cloud.gateway.server.webflux.default-filters[4].args.redis-rate-limiter.burstCapacity=50
spring.cloud.gateway.server.webflux.default-filters[4].args.redis-rate-limiter.requestedTokens=1

# ??? Redis (cho Rate Limiter) ?????????????????????????????????????????????????
spring.data.redis.host=localhost
spring.data.redis.port=6379
# Pool k?t n?i Lettuce cho Rate Limiter
spring.data.redis.lettuce.pool.min-idle=2
spring.data.redis.lettuce.pool.max-idle=10
spring.data.redis.lettuce.pool.max-active=30
spring.data.redis.lettuce.pool.max-wait=1000ms
