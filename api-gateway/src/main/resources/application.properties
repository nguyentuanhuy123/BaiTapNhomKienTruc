spring.application.name=api-gateway
server.port=9000

# Eureka
eureka.client.serviceUrl.defaultZone=http://localhost:8761/eureka

logging.level.root=INFO
logging.level.org.springframework.cloud.gateway.route.RouteDefinitionLocator=INFO
logging.level.org.springframework.cloud.gateway=TRACE

# Product Service
spring.cloud.gateway.server.webflux.routes[0].id=product-service
spring.cloud.gateway.server.webflux.routes[0].uri=lb://product-service
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/api/product/**

spring.cloud.gateway.server.webflux.routes[4].id=product-service-category
spring.cloud.gateway.server.webflux.routes[4].uri=lb://product-service
spring.cloud.gateway.server.webflux.routes[4].predicates[0]=Path=/api/category/**

# Order Service
spring.cloud.gateway.server.webflux.routes[1].id=order-service
spring.cloud.gateway.server.webflux.routes[1].uri=lb://order-service
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/api/order/**, /api/cart/**

# Inventory Service
spring.cloud.gateway.server.webflux.routes[2].id=inventory-service
spring.cloud.gateway.server.webflux.routes[2].uri=lb://inventory-service
spring.cloud.gateway.server.webflux.routes[2].predicates[0]=Path=/api/inventory/**

# User Service
spring.cloud.gateway.server.webflux.routes[3].id=user-service
spring.cloud.gateway.server.webflux.routes[3].uri=lb://user-service
spring.cloud.gateway.server.webflux.routes[3].predicates[0]=Path=/api/user/**

# Discovery Server
spring.cloud.gateway.server.webflux.routes[5].id=discovery-server
spring.cloud.gateway.server.webflux.routes[5].uri=http://localhost:8761
spring.cloud.gateway.server.webflux.routes[5].predicates[0]=Path=/eureka/web
spring.cloud.gateway.server.webflux.routes[5].filters[0]=SetPath=/

# Discovery Server Static Resource Route
spring.cloud.gateway.server.webflux.routes[6].id=discovery-server-static
spring.cloud.gateway.server.webflux.routes[6].uri=http://localhost:8761
spring.cloud.gateway.server.webflux.routes[6].predicates[0]=Path=/eureka/**

#Auth service
spring.cloud.gateway.server.webflux.routes[7].id=auth-service
spring.cloud.gateway.server.webflux.routes[7].uri=lb://auth-service
spring.cloud.gateway.server.webflux.routes[7].predicates[0]=Path=/api/auth/**

spring.cloud.gateway.server.webflux.routes[8].id=payment-service
spring.cloud.gateway.server.webflux.routes[8].uri=lb://payment-service
spring.cloud.gateway.server.webflux.routes[8].predicates[0]=Path=/payment/**

# WebSocket route cho User Service
spring.cloud.gateway.server.webflux.routes[9].id=user-ws-route
spring.cloud.gateway.server.webflux.routes[9].uri=lb:ws://user-service
spring.cloud.gateway.server.webflux.routes[9].predicates[0]=Path=/ws/**

# Flashsale Service Route
spring.cloud.gateway.server.webflux.routes[10].id=flashsale-service
spring.cloud.gateway.server.webflux.routes[10].uri=lb://flashsale-service
spring.cloud.gateway.server.webflux.routes[10].predicates[0]=Path=/api/v1/flashsale/**

# Wishlist Route
spring.cloud.gateway.server.webflux.routes[11].id=wishlist-service
spring.cloud.gateway.server.webflux.routes[11].uri=lb://product-service
spring.cloud.gateway.server.webflux.routes[11].predicates[0]=Path=/api/wishlist/**

# Frontend Route (Thêm vào cuối danh sách routes)
spring.cloud.gateway.server.webflux.routes[12].id=frontend-service
spring.cloud.gateway.server.webflux.routes[12].uri=http://localhost:5173
spring.cloud.gateway.server.webflux.routes[12].predicates[0]=Path=/**

management.endpoints.web.exposure.include=health,info,prometheus
management.prometheus.metrics.export.enabled=true

# CORS (dev)
spring.cloud.gateway.server.webflux.globalcors.add-to-simple-url-handler-mapping=true
spring.cloud.gateway.server.webflux.globalcors.cors-configurations.[/**].allowed-origins=http://localhost:5173
spring.cloud.gateway.server.webflux.globalcors.cors-configurations.[/**].allowed-methods=GET,POST,PUT,PATCH,DELETE,OPTIONS
spring.cloud.gateway.server.webflux.globalcors.cors-configurations.[/**].allowed-headers=*
spring.cloud.gateway.server.webflux.globalcors.cors-configurations.[/**].allow-credentials=true

# Fix duplicate CORS headers: gateway globalcors + upstream service (WebSocketConfig)
spring.cloud.gateway.server.webflux.default-filters[0]=DedupeResponseHeader=Access-Control-Allow-Origin RETAIN_FIRST
spring.cloud.gateway.server.webflux.default-filters[1]=DedupeResponseHeader=Access-Control-Allow-Methods RETAIN_FIRST
spring.cloud.gateway.server.webflux.default-filters[2]=DedupeResponseHeader=Access-Control-Allow-Headers RETAIN_FIRST
spring.cloud.gateway.server.webflux.default-filters[3]=DedupeResponseHeader=Access-Control-Allow-Credentials RETAIN_FIRST
