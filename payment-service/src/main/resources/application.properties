spring.application.name=payment-service
server.port=8086
spring.datasource.url=jdbc:mysql://localhost:3310/payment_service
spring.datasource.username=appuser
spring.datasource.password=apppassword
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.kafka.bootstrap-servers=localhost:9092

# consumer
spring.kafka.consumer.group-id=payment-service
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
spring.kafka.consumer.properties.spring.deserializer.value.delegate.class=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=*
spring.kafka.consumer.properties.spring.json.value.default.type=com.fit.microservices.payment.event.InventoryReservedEvent
spring.kafka.consumer.auto-offset-reset=earliest

# producer
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.producer.properties.spring.json.add.type.headers=false

payment.vnPay.url=http://localhost:8086/fake-vnpay
payment.vnPay.tmnCode=TEST_TMN_CODE
payment.vnPay.secretKey=TEST_SECRET_KEY
payment.vnPay.returnUrl=http://localhost:8086/api/payment/return
payment.vnPay.version=2.1.0
payment.vnPay.command=pay
payment.vnPay.orderType=other