spring.application.name=user-service
# Server port
server.port=8081
# Datasource PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/user_service
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

# Swagger / API Docs
springdoc.swagger-ui.path=/swagger-ui.html

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

management.endpoints.web.exposure.include=health,info,prometheus
management.prometheus.metrics.export.enabled=true

# Optional: timezone
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
eureka.client.serviceUrl.defaultZone=http://localhost:8761/eureka

# Kafka Configuration
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.consumer.group-id=user-service-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer

# Redis Configuration
spring.data.redis.host=localhost
spring.data.redis.port=6379
# If no password is set for redis, leave it empty
# spring.data.redis.password=

# Multipart (avatar upload)
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

# AWS S3 Configuration
# Fill in credentials here or use env vars: AWS_ACCESS_KEY / AWS_SECRET_KEY
aws.access-key=
aws.secret-key=
aws.s3.region=
aws.s3.bucket-name=

spring.devtools.restart.enabled=false