spring.application.name=user-service
server.port=8081

# ??? Graceful Shutdown ????????????????????????????????????????????????????????
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=30s

# ??? Tomcat Thread Pool ???????????????????????????????????????????????????????
# Gi? 10 thread luôn s?n sàng ? ?? cho l?u l??ng th?p, không lãng phí
# Scale lên 200 khi có spike (nghìn request ??ng th?i)
server.tomcat.threads.min-spare=10
server.tomcat.threads.max=200
server.tomcat.accept-count=100
server.tomcat.connection-timeout=10000

# ??? Datasource (PostgreSQL) ??????????????????????????????????????????????????
spring.datasource.url=jdbc:postgresql://localhost:5432/user_service
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

# ??? HikariCP Connection Pool ????????????????????????????????????????????????
spring.datasource.hikari.pool-name=UserHikariPool
# Khi ít request: ch? gi? 5 connection idle ? ti?t ki?m DB resources
spring.datasource.hikari.minimum-idle=5
# Scale t?i 20 connection khi load cao
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.connection-timeout=20000
# Keepalive cho PostgreSQL (tránh timeout sau idle dài)
spring.datasource.hikari.keepalive-time=60000
# Validation query PostgreSQL
spring.datasource.hikari.connection-test-query=SELECT 1

# ??? JPA / Hibernate ?????????????????????????????????????????????????????????
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
# Batch insert/update ? gi?m s? round-trip DB khi có nhi?u write
spring.jpa.properties.hibernate.jdbc.batch_size=20
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# ??? Redis ????????????????????????????????????????????????????????????????????
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.lettuce.pool.min-idle=2
spring.data.redis.lettuce.pool.max-idle=10
spring.data.redis.lettuce.pool.max-active=20
spring.data.redis.lettuce.pool.max-wait=1000ms

# ??? Actuator / Metrics ???????????????????????????????????????????????????????
management.endpoints.web.exposure.include=health,info,prometheus
management.prometheus.metrics.export.enabled=true
management.endpoint.health.show-details=always
management.health.redis.enabled=true
management.health.db.enabled=true

# ??? Eureka ??????????????????????????????????????????????????????????????????
eureka.client.serviceUrl.defaultZone=http://localhost:8761/eureka

# ??? Swagger / API Docs ??????????????????????????????????????????????????????
springdoc.swagger-ui.path=/swagger-ui.html

# ??? Kafka ???????????????????????????????????????????????????????????????????
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.consumer.group-id=user-service-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
# T?ng throughput consumer khi nhi?u event ??n cùng lúc
spring.kafka.consumer.max-poll-records=50

spring.kafka.producer.acks=all
spring.kafka.producer.retries=10
spring.kafka.producer.properties.enable.idempotence=true
spring.kafka.producer.properties.max.in.flight.requests.per.connection=5
spring.kafka.producer.compression-type=lz4
spring.kafka.producer.batch-size=16384
spring.kafka.producer.linger-ms=5

# ??? Multipart ???????????????????????????????????????????????????????????????
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

# ??? AWS S3 ??????????????????????????????????????????????????????????????????
aws.access-key=
aws.secret-key=
aws.s3.region=ap-southeast-1
aws.s3.bucket-name=thi-giua-ki-cnm-bucket

spring.devtools.restart.enabled=false
