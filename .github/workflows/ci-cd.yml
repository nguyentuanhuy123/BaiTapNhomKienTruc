name: Java & Node.js CI/CD Pipeline

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]

jobs:
  # Job 1: Build & Test all Backend Maven Microservices
  build-backend:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: maven

    - name: Build and Test Backend Services
      run: mvn clean package -DskipTests

  # Job 2: Build & Test Frontend React application
  build-frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: './frontend/package-lock.json'

    - name: Install dependencies
      run: npm ci

    - name: Build Frontend Application
      run: npm run build

  # Job 3: Deploy to AWS EC2 via SSH
  deploy:
    needs: [build-backend, build-frontend]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main'
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Deploy to EC2
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.AWS_HOST }}
        username: ${{ secrets.AWS_USERNAME }}
        key: ${{ secrets.AWS_SSH_KEY }}
        port: 22
        timeout: 30m
        command_timeout: 30m
        script: |
          cd BaiTapNhomKienTruc
          git pull origin develop
          echo "${{ secrets.AWS_S3_ENV }}" > .env
          
          echo "Stopping old containers to free 100% RAM..."
          docker compose down --remove-orphans
          
          echo "Building all backend services (generating target/*.jar)..."
          mvn clean package -DskipTests
          
          echo "Starting batch 1: Core Infra (Redis, Discovery Server)..."
          docker compose up -d redis discovery-server
          sleep 15
          
          echo "Starting batch 2: Core Databases..."
          docker compose up -d mysql-auth postgres-user mysql-product mysql-inventory
          sleep 20
          
          echo "Starting batch 3: Secondary Databases & Messaging..."
          docker compose up -d mysql-order mysql-payment zookeeper kafka
          sleep 20
          
          echo "Starting batch 4: Core Services & Gateway..."
          docker compose up -d api-gateway auth-service user-service
          sleep 25
          
          echo "Starting batch 5: Product & Inventory Services..."
          docker compose up -d product-service inventory-service
          sleep 25
          
          echo "Starting batch 5.5: Payment & Order Services..."
          docker compose up -d payment-service order-service
          sleep 25
          
          echo "Starting batch 6: Supporting Services (Notification, Chatbot, Flashsale)..."
          docker compose up -d notification-service chatbot-service flashsale-service
          
          echo "Waiting 15 seconds for services to initialize diagnostics..."
          sleep 15
          
          echo "=== DOCKER CONTAINER STATUS ==="
          docker ps -a
          
          echo "Deployment completed successfully!"

