name: Java & Node.js CI/CD Pipeline

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]

jobs:
  # Job 1: Build Java applications, build Docker Images, and push to GitHub Container Registry (GHCR)
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: maven

    - name: Build Backend Services
      run: mvn clean package -DskipTests

    - name: Log in to GitHub Container Registry
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build and Push Docker Images
      run: |
        # Convert repository owner to lowercase for Docker compatibility
        OWNER_LC=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
        echo "Owner in lowercase: $OWNER_LC"
        
        services=(
          "discovery-server"
          "api-gateway"
          "auth-service"
          "product-service"
          "order-service"
          "payment-service"
          "user-service"
          "chatbot-service"
          "flashsale-service"
          "inventory-service"
          "notification-service"
        )
        
        for service in "${services[@]}"; do
          echo "============================================="
          echo "BUILDING & PUSHING: $service"
          echo "============================================="
          docker build -t ghcr.io/$OWNER_LC/baitapnhomkientruc/$service:latest ./$service
          docker push ghcr.io/$OWNER_LC/baitapnhomkientruc/$service:latest
        done

  # Job 2: Deploy to AWS EC2 via SSH
  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main'
    steps:
    - name: Deploy to EC2
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.AWS_HOST }}
        username: ${{ secrets.AWS_USERNAME }}
        key: ${{ secrets.AWS_SSH_KEY }}
        port: 22
        timeout: 10m
        command_timeout: 10m
        script: |
          cd BaiTapNhomKienTruc
          git pull origin develop
          echo "${{ secrets.AWS_S3_ENV }}" > .env
          
          echo "Logging in to GitHub Container Registry on EC2..."
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
          
          echo "Stopping old containers to free 100% RAM..."
          docker compose -f docker-compose.prod.yml down --remove-orphans
          
          echo "Pulling latest pre-built images from GHCR..."
          docker compose -f docker-compose.prod.yml pull
          
          echo "Starting batch 1: Infrastructure & Databases..."
          docker compose -f docker-compose.prod.yml up -d redis zookeeper kafka mysql-product mysql-order mysql-payment mysql-auth mysql-inventory postgres-user
          sleep 20
          
          echo "Starting batch 2: Core Platform Services..."
          docker compose -f docker-compose.prod.yml up -d discovery-server api-gateway auth-service user-service
          sleep 20
          
          echo "Starting batch 3: Business Microservices..."
          docker compose -f docker-compose.prod.yml up -d product-service inventory-service order-service payment-service chatbot-service flashsale-service notification-service
          
          echo "Waiting 15 seconds for services to settle..."
          sleep 15
          
          echo "=== DOCKER CONTAINER STATUS ==="
          docker ps -a
          
          echo "Deployment completed successfully in under 2 minutes!"
